<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bill Form</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.card{
background:#fff;
width:90%;
max-width:500px;
padding:25px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
animation:slideUp .7s ease;
}
input,textarea{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #ddd;
border-radius:12px;
box-sizing:border-box;
}
button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
@keyframes slideUp{
from{opacity:0;transform:translateY(50px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<div class="card">
<h2>💰 Bill Generator</h2>

<input id="society" placeholder="Society Name">
<input id="date" type="date">
<input id="expense" placeholder="Expense Name">
<textarea id="details" placeholder="Expense Details"></textarea>
<input id="amount" placeholder="Amount">
<input id="payee" placeholder="Payee Name">
<input id="approved" placeholder="Approved By">

<button onclick="createBill()">Generate Bill</button>
</div>

<script>
function createBill(){

localStorage.setItem("society",document.getElementById("society").value);
localStorage.setItem("date",document.getElementById("date").value);
localStorage.setItem("expense",document.getElementById("expense").value);
localStorage.setItem("details",document.getElementById("details").value);
localStorage.setItem("amount",document.getElementById("amount").value);
localStorage.setItem("payee",document.getElementById("payee").value);
localStorage.setItem("approved",document.getElementById("approved").value);

window.location.href="bill.html";
}
</script>

</body>
</html>
